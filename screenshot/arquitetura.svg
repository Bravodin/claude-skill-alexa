<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="850" viewBox="0 0 1250 850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37475A"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8794"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #232F3E; }
      .subtitle { font-size: 13px; fill: #5F6B7A; }
      .panel-title { font-size: 15px; font-weight: 700; fill: #232F3E; }
      .head { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .h { font-size: 12.5px; font-weight: 700; fill: #232F3E; }
      .t { font-size: 12px; fill: #37475A; }
      .s { font-size: 11px; fill: #5F6B7A; }
      .mono { font-family: Consolas, Menlo, monospace; font-size: 11.5px; fill: #37475A; }
      .num { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .lbl { font-size: 11px; fill: #37475A; }
      .flow { stroke: #37475A; stroke-width: 2; fill: none; }
      .dash { stroke: #7A8794; stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; }
    </style>
  </defs>

  <rect width="1250" height="850" fill="#FFFFFF"/>

  <text x="30" y="38" class="title">Assistente Chat — Arquitetura (Alexa + Claude)</text>
  <text x="30" y="58" class="subtitle">Skill Alexa-hosted em Python que envia a pergunta falada para a API do Claude e lê a resposta em voz alta</text>

  <!-- ============ PAINEL 1: RUNTIME ============ -->
  <rect x="15" y="70" width="1220" height="455" rx="12" fill="#F6F8FA" stroke="#D5DBE1"/>
  <text x="30" y="94" class="panel-title">1. Fluxo de uma pergunta</text>

  <!-- Usuário -->
  <rect x="30" y="110" width="150" height="310" rx="10" fill="#FFFFFF" stroke="#8A96A3" stroke-width="1.5"/>
  <rect x="30" y="110" width="150" height="34" rx="10" fill="#5F6B7A"/>
  <rect x="30" y="134" width="150" height="10" fill="#5F6B7A"/>
  <text x="105" y="132" class="head" text-anchor="middle">Usuário</text>
  <circle cx="105" cy="178" r="14" fill="none" stroke="#5F6B7A" stroke-width="2.5"/>
  <path d="M80,225 Q80,198 105,198 Q130,198 130,225" fill="none" stroke="#5F6B7A" stroke-width="2.5"/>
  <text x="105" y="258" class="t" text-anchor="middle" font-style="italic">
    <tspan x="105">“Alexa, pergunte</tspan>
    <tspan x="105" dy="16">ao assistente chat</tspan>
    <tspan x="105" dy="16">o que é um</tspan>
    <tspan x="105" dy="16">buraco negro”</tspan>
  </text>
  <text x="105" y="345" class="s" text-anchor="middle">
    <tspan x="105">ou só “pergunte ao</tspan>
    <tspan x="105" dy="14">assistente chat” e</tspan>
    <tspan x="105" dy="14">depois a pergunta</tspan>
  </text>

  <!-- Echo -->
  <rect x="220" y="110" width="160" height="310" rx="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
  <rect x="220" y="110" width="160" height="34" rx="10" fill="#232F3E"/>
  <rect x="220" y="134" width="160" height="10" fill="#232F3E"/>
  <text x="300" y="132" class="head" text-anchor="middle">Echo / App Alexa</text>
  <ellipse cx="300" cy="172" rx="30" ry="8" fill="#00A8E1"/>
  <path d="M270,172 L270,222 Q300,236 330,222 L330,172" fill="#232F3E"/>
  <text x="300" y="268" class="t" text-anchor="middle">
    <tspan x="300">microfone capta</tspan>
    <tspan x="300" dy="16">a fala</tspan>
  </text>
  <text x="300" y="330" class="t" text-anchor="middle">
    <tspan x="300">alto-falante toca</tspan>
    <tspan x="300" dy="16">a resposta</tspan>
  </text>

  <!-- Alexa Cloud -->
  <rect x="420" y="110" width="260" height="310" rx="10" fill="#FFFFFF" stroke="#00A8E1" stroke-width="1.5"/>
  <rect x="420" y="110" width="260" height="34" rx="10" fill="#00A8E1"/>
  <rect x="420" y="134" width="260" height="10" fill="#00A8E1"/>
  <text x="550" y="132" class="head" text-anchor="middle">Alexa Cloud (Amazon)</text>

  <rect x="432" y="155" width="236" height="42" rx="6" fill="#E6F6FC" stroke="#9AD8EF"/>
  <text x="444" y="173" class="h">ASR</text>
  <text x="444" y="189" class="t">voz → texto</text>

  <rect x="432" y="205" width="236" height="128" rx="6" fill="#E6F6FC" stroke="#9AD8EF"/>
  <text x="444" y="223" class="h">NLU + modelo de interação</text>
  <text x="444" y="240" class="s">interactionModels/custom/pt-BR.json</text>
  <text x="444" y="259" class="t">invocação: <tspan font-weight="700">“assistente chat”</tspan></text>
  <text x="444" y="277" class="t">ChatIntent: “me diga {pergunta}”, …</text>
  <text x="444" y="295" class="t">slot pergunta: AMAZON.SearchQuery</text>
  <text x="444" y="313" class="s">+ Help · Stop · Cancel · Fallback</text>

  <rect x="432" y="341" width="236" height="68" rx="6" fill="#E6F6FC" stroke="#9AD8EF"/>
  <text x="444" y="359" class="h">TTS</text>
  <text x="444" y="376" class="t">SSML → voz</text>
  <text x="444" y="395" class="s">espera no máximo ~8 s pela Lambda</text>

  <!-- AWS Lambda -->
  <rect x="720" y="110" width="280" height="310" rx="10" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
  <rect x="720" y="110" width="280" height="34" rx="10" fill="#FF9900"/>
  <rect x="720" y="134" width="280" height="10" fill="#FF9900"/>
  <text x="860" y="132" class="head" text-anchor="middle" fill="#232F3E" style="fill:#232F3E">AWS Lambda (Alexa-hosted)</text>
  <text x="860" y="160" class="s" text-anchor="middle">lambda_function.py · ASK SDK + anthropic</text>

  <rect x="732" y="168" width="256" height="72" rx="6" fill="#FFF4E0" stroke="#FFCC80"/>
  <text x="744" y="186" class="h">SkillBuilder → handlers</text>
  <text x="744" y="203" class="t">LaunchRequest · <tspan font-weight="700">ChatIntent</tspan> · Help</text>
  <text x="744" y="219" class="t">Cancel/Stop · Fallback · SessionEnded</text>
  <text x="744" y="234" class="s">IntentReflector (último) · CatchAllException</text>

  <rect x="732" y="248" width="256" height="78" rx="6" fill="#FFF4E0" stroke="#FFCC80"/>
  <text x="744" y="266" class="h">ask_claude(pergunta)</text>
  <text x="744" y="283" class="t">histórico em session_attributes</text>
  <text x="744" y="299" class="t">recomeça após MAX_TURNS = 6</text>
  <text x="744" y="315" class="s">erros da API → frase falada amigável</text>

  <rect x="732" y="334" width="256" height="75" rx="6" fill="#FFF4E0" stroke="#FFCC80"/>
  <text x="744" y="352" class="h">_to_speech() + ANSWER_PREFIX</text>
  <text x="744" y="369" class="t">remove markdown, escapa SSML</text>
  <text x="744" y="385" class="t">“Assistente Chat disse o seguinte: …”</text>
  <text x="744" y="401" class="s">chave: lambda/anthropic_key.txt</text>

  <!-- Anthropic -->
  <rect x="1040" y="110" width="180" height="310" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  <rect x="1040" y="110" width="180" height="34" rx="10" fill="#D97757"/>
  <rect x="1040" y="134" width="180" height="10" fill="#D97757"/>
  <text x="1130" y="132" class="head" text-anchor="middle">Claude API</text>
  <text x="1052" y="168" class="s">api.anthropic.com</text>
  <text x="1052" y="190" class="h">messages.create</text>
  <text x="1052" y="208" class="mono">claude-haiku-5-5</text>
  <text x="1052" y="234" class="t">
    <tspan x="1052">system prompt:</tspan>
    <tspan x="1052" dy="16">pt-BR, 3–4 frases,</tspan>
    <tspan x="1052" dy="16">sem markdown</tspan>
  </text>
  <text x="1052" y="296" class="t">
    <tspan x="1052">timeout 7 s</tspan>
    <tspan x="1052" dy="16">max_retries 0</tspan>
    <tspan x="1052" dy="16">effort: low</tspan>
  </text>
  <text x="1052" y="372" class="s">
    <tspan x="1052">pago com créditos da API</tspan>
    <tspan x="1052" dy="14">(Claude Console)</tspan>
  </text>

  <!-- Setas de ida (y=190) -->
  <line x1="181" y1="190" x2="218" y2="190" class="flow" marker-end="url(#arrow)"/>
  <line x1="381" y1="190" x2="418" y2="190" class="flow" marker-end="url(#arrow)"/>
  <line x1="681" y1="190" x2="718" y2="190" class="flow" marker-end="url(#arrow)"/>
  <line x1="1001" y1="190" x2="1038" y2="190" class="flow" marker-end="url(#arrow)"/>
  <!-- Setas de volta (y=360) -->
  <line x1="1038" y1="360" x2="1001" y2="360" class="flow" marker-end="url(#arrow)"/>
  <line x1="718" y1="360" x2="681" y2="360" class="flow" marker-end="url(#arrow)"/>
  <line x1="418" y1="360" x2="381" y2="360" class="flow" marker-end="url(#arrow)"/>
  <line x1="218" y1="360" x2="181" y2="360" class="flow" marker-end="url(#arrow)"/>

  <!-- Números -->
  <g>
    <circle cx="200" cy="172" r="10" fill="#232F3E"/><text x="200" y="176" class="num" text-anchor="middle">1</text>
    <circle cx="400" cy="172" r="10" fill="#232F3E"/><text x="400" y="176" class="num" text-anchor="middle">2</text>
    <circle cx="700" cy="172" r="10" fill="#232F3E"/><text x="700" y="176" class="num" text-anchor="middle">3</text>
    <circle cx="1020" cy="172" r="10" fill="#232F3E"/><text x="1020" y="176" class="num" text-anchor="middle">4</text>
    <circle cx="1020" cy="342" r="10" fill="#232F3E"/><text x="1020" y="346" class="num" text-anchor="middle">5</text>
    <circle cx="700" cy="342" r="10" fill="#232F3E"/><text x="700" y="346" class="num" text-anchor="middle">6</text>
    <circle cx="400" cy="342" r="10" fill="#232F3E"/><text x="400" y="346" class="num" text-anchor="middle">7</text>
    <circle cx="200" cy="342" r="10" fill="#232F3E"/><text x="200" y="346" class="num" text-anchor="middle">8</text>
  </g>

  <!-- Legenda dos passos -->
  <g>
    <circle cx="42" cy="446" r="9" fill="#232F3E"/><text x="42" y="450" class="num" text-anchor="middle">1</text>
    <text x="58" y="450" class="lbl">Usuário fala o comando</text>
    <circle cx="42" cy="469" r="9" fill="#232F3E"/><text x="42" y="473" class="num" text-anchor="middle">2</text>
    <text x="58" y="473" class="lbl">Echo envia o áudio para a Alexa Cloud</text>
    <circle cx="42" cy="492" r="9" fill="#232F3E"/><text x="42" y="496" class="num" text-anchor="middle">3</text>
    <text x="58" y="496" class="lbl">IntentRequest (JSON): ChatIntent + slot pergunta</text>
    <circle cx="42" cy="515" r="9" fill="#232F3E"/><text x="42" y="519" class="num" text-anchor="middle">4</text>
    <text x="58" y="519" class="lbl">messages.create: system + histórico + pergunta</text>

    <circle cx="352" cy="446" r="9" fill="#232F3E"/><text x="352" y="450" class="num" text-anchor="middle">5</text>
    <text x="368" y="450" class="lbl">Claude devolve a resposta em texto</text>
    <circle cx="352" cy="469" r="9" fill="#232F3E"/><text x="352" y="473" class="num" text-anchor="middle">6</text>
    <text x="368" y="473" class="lbl">Response: speak(SSML), shouldEndSession=true</text>
    <circle cx="352" cy="492" r="9" fill="#232F3E"/><text x="352" y="496" class="num" text-anchor="middle">7</text>
    <text x="368" y="496" class="lbl">TTS gera o áudio da resposta</text>
    <circle cx="352" cy="515" r="9" fill="#232F3E"/><text x="352" y="519" class="num" text-anchor="middle">8</text>
    <text x="368" y="519" class="lbl">Usuário ouve a resposta; a skill fecha</text>
  </g>

  <!-- Nota de limites -->
  <rect x="1010" y="432" width="210" height="86" rx="8" fill="#FFF8E6" stroke="#F0C36D"/>
  <text x="1022" y="451" class="h">Limites da Alexa</text>
  <text x="1022" y="469" class="s">• espera ~8 s pela resposta</text>
  <text x="1022" y="485" class="s">• payload de resposta ≤ ~24 KB</text>
  <text x="1022" y="501" class="s">• modelo rápido (Haiku) para caber</text>

  <!-- ============ PAINEL 2: DEPLOY ============ -->
  <rect x="15" y="545" width="1220" height="290" rx="12" fill="#F6F8FA" stroke="#D5DBE1"/>
  <text x="30" y="569" class="panel-title">2. Deploy e configuração</text>

  <!-- PC -->
  <rect x="30" y="595" width="250" height="150" rx="10" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="1.5"/>
  <rect x="30" y="595" width="250" height="30" rx="10" fill="#5F6B7A"/>
  <rect x="30" y="615" width="250" height="10" fill="#5F6B7A"/>
  <text x="155" y="615" class="head" text-anchor="middle">PC do desenvolvedor</text>
  <text x="42" y="645" class="s">este repositório (GitHub)</text>
  <text x="42" y="663" class="mono">lambda/lambda_function.py</text>
  <text x="42" y="679" class="mono">lambda/requirements.txt</text>
  <text x="42" y="695" class="mono">lambda/anthropic_key.txt</text>
  <text x="42" y="709" class="s">  (no .gitignore, nunca vai para o Git)</text>
  <text x="42" y="729" class="mono">interactionModels/…/pt-BR.json</text>

  <!-- build-zip -->
  <rect x="330" y="595" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#5F6B7A" stroke-width="1.5"/>
  <rect x="330" y="595" width="200" height="30" rx="10" fill="#37475A"/>
  <rect x="330" y="615" width="200" height="10" fill="#37475A"/>
  <text x="430" y="615" class="head" text-anchor="middle">build-zip.ps1</text>
  <text x="342" y="647" class="t">gera</text>
  <text x="342" y="665" class="mono">dist/assistente-chat-</text>
  <text x="342" y="681" class="mono">lambda.zip</text>
  <text x="342" y="703" class="s">pasta lambda/ na raiz do zip</text>
  <text x="342" y="719" class="s">contém a chave: não compartilhe</text>

  <!-- Console -->
  <rect x="580" y="595" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#00A8E1" stroke-width="1.5"/>
  <rect x="580" y="595" width="280" height="30" rx="10" fill="#00A8E1"/>
  <rect x="580" y="615" width="280" height="10" fill="#00A8E1"/>
  <text x="720" y="615" class="head" text-anchor="middle">Alexa Developer Console</text>
  <text x="592" y="649" class="t"><tspan font-weight="700">Code</tspan> → Import Code → Deploy</text>
  <text x="592" y="671" class="t"><tspan font-weight="700">Build</tspan> → JSON Editor → Build skill</text>
  <text x="592" y="693" class="t"><tspan font-weight="700">Test</tspan> → Development · Portuguese (BR)</text>
  <text x="592" y="719" class="s">em Development já funciona nos Echos da conta</text>

  <!-- CloudWatch -->
  <rect x="880" y="595" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5"/>
  <text x="960" y="620" class="h" text-anchor="middle">CloudWatch Logs</text>
  <text x="960" y="640" class="s" text-anchor="middle">logger da Lambda</text>
  <text x="960" y="656" class="s" text-anchor="middle">Code → CloudWatch Logs</text>

  <!-- S3 -->
  <rect x="1060" y="595" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1140" y="620" class="h" text-anchor="middle">S3 (Alexa-hosted)</text>
  <text x="1140" y="640" class="s" text-anchor="middle">utils.py · boto3</text>
  <text x="1140" y="656" class="s" text-anchor="middle">futuro: histórico e consumo</text>

  <!-- Setas do deploy -->
  <line x1="281" y1="660" x2="328" y2="660" class="flow" marker-end="url(#arrow)"/>
  <line x1="531" y1="660" x2="578" y2="660" class="flow" marker-end="url(#arrow)"/>
  <rect x="540" y="642" width="30" height="13" fill="#F6F8FA"/>
  <text x="555" y="652" class="lbl" text-anchor="middle">zip</text>

  <path d="M155,746 L155,790 L720,790 L720,748" class="flow" marker-end="url(#arrow)"/>
  <rect x="330" y="780" width="230" height="18" fill="#F6F8FA"/>
  <text x="445" y="793" class="lbl" text-anchor="middle">pt-BR.json colado em Build → JSON Editor</text>

  <!-- Console atualiza Alexa Cloud e Lambda (sobem para o painel 1) -->
  <line x1="660" y1="594" x2="660" y2="422" class="dash" marker-end="url(#arrow-dash)"/>
  <rect x="604" y="527" width="112" height="16" fill="#FFFFFF"/>
  <text x="660" y="539" class="lbl" text-anchor="middle">Build skill</text>
  <line x1="800" y1="594" x2="800" y2="422" class="dash" marker-end="url(#arrow-dash)"/>
  <rect x="770" y="527" width="60" height="16" fill="#FFFFFF"/>
  <text x="800" y="539" class="lbl" text-anchor="middle">Deploy</text>
  <line x1="940" y1="421" x2="940" y2="593" class="dash" marker-end="url(#arrow-dash)"/>
  <rect x="917" y="527" width="46" height="16" fill="#FFFFFF"/>
  <text x="940" y="539" class="lbl" text-anchor="middle">logs</text>

  <text x="1220" y="825" class="s" text-anchor="end">Linhas tracejadas: configuração/observabilidade, fora do caminho de cada pergunta</text>
</svg>
